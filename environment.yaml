name: breast-cancer-agent
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  # --- Core ---
  - python=3.10
  - pip

  # --- Numerical stack (ABI safe) ---
  - numpy=1.26
  - pandas=2.1

  # --- PyTorch + CUDA ---
  - pytorch=2.1
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1

  # --- Computer Vision ---
  - opencv

  # --- LLM / Agents ---
  - langchain
  - langgraph
  - langgraph-prebuilt

  # --- Utilities ---
  - matplotlib
  - tqdm
  - pyyaml
