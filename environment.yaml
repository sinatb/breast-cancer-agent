name: breast-cancer-agent

channels:
  - pytorch
  - nvidia
  - defaults
  - conda-forge

dependencies:
  - python=3.10
  - pip

  # --- PyTorch (GPU) ---
  - pytorch=2.3.*
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1

  # --- Scientific stack ---
  - numpy
  - pandas
  - scipy
  - scikit-learn

  # --- Imaging / plotting ---
  - opencv
  - pillow
  - matplotlib
  - seaborn

  # --- Dev / notebooks ---
  - jupyter
  - ipywidgets
  - tqdm
  - mlflow

  # --- Quality ---
  - black
  - flake8

  - pip:
      - ipympl
